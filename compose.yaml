# Local development database only. Production uses Laravel Cloud's managed Postgres.
services:
  pgsql:
    image: postgres:17
    ports:
      - "5433:5432" # 5433 on the host to avoid clashing with other local Postgres instances
    environment:
      POSTGRES_DB: pixelforge
      POSTGRES_USER: pixelforge
      POSTGRES_PASSWORD: secret
    volumes:
      - pgsql-data:/var/lib/postgresql/data
      - ./docker/pgsql/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pixelforge"]
      interval: 5s
      retries: 10

volumes:
  pgsql-data:
